<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ordem de compra · The Soul Food Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f0e4;--paper:#fff;--ink:#2A2A3A;--brand:#060644;--steel:#5D5D72;--faint:#8a889c;--line:#E4E2EA;--line2:#cfccd8;--cob:#B87333;--ok:#237a55;--ok-s:#e9f5ef;--warn:#9a5a22;--warn-s:#fbf3e6;--neg:#a8432a;--neg-s:#fbeee9}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:720px;margin:0 auto;padding:18px 16px 140px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1.5px solid var(--brand)}
.hd img{height:38px;width:auto;display:block}
.hd .n{text-align:right;line-height:1.15}.hd .n span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.hd .n b{display:block;font:500 21px Fraunces,Georgia,serif;color:var(--brand)}
h1{font:500 26px/1.15 Fraunces,Georgia,serif;color:var(--brand);margin:22px 0 6px}
.lead{color:var(--steel);margin:0 0 16px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.meta div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.meta small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.meta b{font-size:14.5px;font-weight:600;display:block;overflow-wrap:anywhere}
@media(max-width:520px){.meta{grid-template-columns:1fr 1fr}.meta div:first-child{grid-column:1/-1}}
.it{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.it.ch{border-color:#e6c48a;background:#fffbf3}.it.no{background:#faf8f5}.it.no .g{opacity:.45}
.it .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.it .t b{font-size:15.5px;font-weight:600}
.it .t span{font-size:13px;color:var(--steel);white-space:nowrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--steel)}
label.f input{height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font:600 17px Jost;color:var(--ink);background:#fff;width:100%;-moz-appearance:textfield}
label.f input:focus{outline:0;border-color:var(--brand)}
label.f input::-webkit-inner-spin-button{-webkit-appearance:none}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tg{all:unset;cursor:pointer;font:500 13.5px Jost;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--steel)}
.tg[aria-pressed="true"]{background:var(--neg-s);border-color:#e6b9ad;color:var(--neg)}
.ob{all:unset;flex:1;min-width:140px;font:400 14px Jost;border-bottom:1px dashed var(--line2);padding:6px 2px}
.df{font-size:12.5px;font-weight:600;color:var(--warn);margin-top:8px}
.it.no .df{color:var(--neg)}
.gen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gen .full{grid-column:1/-1}
.gen label.f input,.gen textarea{height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font:500 15px Jost;background:#fff;width:100%}
.gen textarea{height:auto;min-height:70px;padding:10px 12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .tt{flex:1;min-width:0;line-height:1.2}
.bar .tt b{font:500 22px Fraunces,Georgia,serif;color:var(--brand);display:block}
.bar .tt small{color:var(--steel);font-size:12.5px}
.go{all:unset;cursor:pointer;background:var(--brand);color:#fff;font:600 16px Jost;padding:14px 22px;border-radius:14px;white-space:nowrap}
.go[disabled]{opacity:.5;cursor:default}
.msg{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;margin-top:28px}
.msg .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:34px;color:#fff;background:var(--ok)}
.msg .ic.w{background:var(--cob)}.msg .ic.x{background:var(--neg)}
.msg h2{font:500 25px Fraunces,Georgia,serif;color:var(--brand);margin:0 0 8px}
.msg p{color:var(--steel);margin:6px 0}
.pill{display:inline-block;font:600 12px Jost;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.pill.completa{background:var(--ok-s);color:var(--ok)}.pill.parcial{background:var(--neg-s);color:var(--neg)}.pill.ressalva{background:var(--warn-s);color:var(--warn)}
.lnk{all:unset;cursor:pointer;color:var(--brand);text-decoration:underline;text-underline-offset:3px;font-weight:500;margin-top:10px;display:inline-block}
/* OC oficial */
.doc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 24px;margin-top:18px}
.vok{display:flex;gap:12px;align-items:center;background:var(--ok-s);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600;margin-top:16px}
.vok i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--brand)}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;border-bottom:0;font-size:15px}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cond div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cond small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.nf{margin-top:14px;border:1.5px solid var(--cob);border-radius:12px;padding:12px 14px;font-size:14px}
.nf b{color:var(--cob)}
.foot{display:flex;gap:16px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.foot #qr{width:104px;height:104px;flex:none}.foot #qr svg,.foot #qr img{width:100%;height:100%}
.foot p{margin:0;font-size:12.5px;color:var(--steel)}
.prt{all:unset;cursor:pointer;margin-top:16px;display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:9px 16px;font:500 14px Jost;background:#fff}
@media print{body{background:#fff}.w{padding:0}.prt,.noprint{display:none!important}.doc{border:0;padding:0}}
</style>
</head>
<body>
<div class="w" id="app"><div class="msg"><p>Abrindo a ordem de compra…</p></div></div>
<div class="bar" id="bar" hidden></div>
<script>
const SB='https://zumcshmqwwhvlnsdtpjo.supabase.co', KEY='sb_publishable_RxGIQftz2ECn83uEQvsrmg_NEbq2u6J';
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEAD=n=>`<div class="hd"><img src="logo-h.png" alt="The Soul Food Factory"><div class="n"><span>Ordem de compra</span><b>${esc(n||'')}</b></div></div>`;
async function rpc(fn,args){ const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)}); const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(_){ } if(!r.ok) throw new Error((j&&(j.message||j.hint))||('erro '+r.status)); return j; }
const P=new URLSearchParams(location.search), H=new URLSearchParams((location.hash||'').replace(/^#/,''));
const TK=P.get('t')||H.get('t'), VN=P.get('v')||H.get('v'), VC=P.get('c')||H.get('c');
let O=null, A=null;
function pdata(s){ const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})/); if(!m) return ''; const n=new Date(), y=(+m[2]<n.getMonth()+1-6)?n.getFullYear()+1:n.getFullYear(); return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'); }
function dlabel(d,t){ if(!d) return ''; const x=new Date(d+'T12:00:00'); return ['dom','seg','ter','qua','qui','sex','sáb'][x.getDay()]+' '+d.slice(8,10)+'/'+d.slice(5,7)+(t?' · '+t:''); }
function fail(t,p){ $('#bar').hidden=true; $('#app').innerHTML=HEAD('')+`<div class="msg"><div class="ic x">!</div><h2>${t}</h2><p>${p||''}</p></div>`; }

/* ---------- fornecedor: confere e responde ---------- */
async function abrir(){ try{ O=await rpc('oc_abrir',{p_token:TK}); }catch(e){ return fail('Não consegui abrir a ordem','Verifique a internet e tente de novo. ('+esc(e.message)+')'); }
  if(!O) return fail('Ordem não encontrada','O link pode estar incompleto. Peça para a The Soul Food Factory reenviar.');
  if(O.status==='cancelada') return fail('Esta ordem foi cancelada','Não é preciso entregar nada desta ordem.');
  if(O.status==='aprovada') return enviado(O.resposta&&O.resposta.classe,true);
  const R=O.resposta||{};
  A={itens:O.itens.map((i,k)=>{ const r=(R.itens||[])[k]; return r?{q:+r.q,p:+r.p,no:!!r.no,ob:r.ob||''}:{q:+i.q,p:+i.p,no:false,ob:''}; }),entrega:R.entrega||O.entrega||'',data:R.data||pdata(O.entrega),turno:R.turno||'',nome:R.nome||O.contato||'',obs:R.obs||''};
  draw(!!O.resposta); }
const ch=(i,a)=>a.no||Math.abs(a.q-i.q)>0.0005||Math.abs(a.p-i.p)>0.005;
function tot(){ return O.itens.reduce((s,i,k)=>{ const a=A.itens[k]; return s+(a.no?0:a.q*a.p); },0); }
function sum(){ let f=0,m=0; O.itens.forEach((i,k)=>{ const a=A.itens[k]; if(a.no) f++; else if(ch(i,a)) m++; }); return {f,m}; }
function itemHTML(i,k){ const a=A.itens[k], c=ch(i,a); const d=[]; if(!a.no){ if(Math.abs(a.q-i.q)>0.0005) d.push(`quantidade ${nf(i.q)} → ${nf(a.q)} ${esc(i.un)}`); if(Math.abs(a.p-i.p)>0.005) d.push(`preço ${brl(i.p)} → ${brl(a.p)}`); }
  return `<div class="it ${c?'ch':''} ${a.no?'no':''}" id="it${k}"><div class="t"><b>${esc(i.n)}</b><span>pedido ${nf(i.q)} ${esc(i.un)} · ${brl(i.p)}</span></div>
   <div class="g"><label class="f">Vou entregar (${esc(i.un)})<input type="number" inputmode="decimal" step="any" min="0" data-k="${k}" data-f="q" value="${a.q}" ${a.no?'disabled':''}></label><label class="f">Preço por ${esc(i.un)} (R$)<input type="number" inputmode="decimal" step="0.01" min="0" data-k="${k}" data-f="p" value="${a.p}" ${a.no?'disabled':''}></label></div>
   <div class="row"><button type="button" class="tg" data-no="${k}" aria-pressed="${a.no}">Não tenho</button><input class="ob" data-k="${k}" data-f="ob" value="${esc(a.ob)}" placeholder="observação (opcional)"></div>
   ${a.no?'<div class="df">Não vai entregar este item</div>':d.length?`<div class="df">Alterado: ${d.join(' · ')}</div>`:''}</div>`; }
function draw(again){ $('#app').innerHTML=HEAD(O.numero)+`<h1>Olá, ${esc(O.contato||'fornecedor')}!</h1><p class="lead">${again?'Você já respondeu esta ordem. Se precisar, ajuste e envie de novo enquanto ela não for aprovada.':'Confira cada item. Se a quantidade ou o preço mudou, ajuste aqui. Se não tiver o produto, toque em “Não tenho”. No fim, toque em <b>Salvar e enviar</b>.'}</p>
  <div class="meta"><div><small>Fornecedor</small><b>${esc(O.fornecedor)}</b></div><div><small>Entrega pedida</small><b>${esc(O.entrega||'')}</b></div><div><small>Pagamento</small><b>${esc(O.pagamento||'')}</b></div></div>
  ${O.itens.map(itemHTML).join('')}
  <div class="gen"><label class="f full">Quando você vai entregar?<input type="date" data-g="data" value="${esc(A.data)}"></label><div class="full"><span style="font-size:12px;color:var(--steel)">Turno da entrega</span><div class="row" style="margin-top:4px">${['manhã','tarde'].map(x=>`<button type="button" class="tg" data-turno="${x}" aria-pressed="${A.turno===x}" style="${A.turno===x?'background:#e9f5ef;border-color:#9cc7ad;color:#237a55':''}">${x==='manhã'?'Manhã (8h–12h)':'Tarde (13h–17h)'}</button>`).join('')}</div></div><label class="f">Seu nome<input data-g="nome" value="${esc(A.nome)}"></label><label class="f full">Observações gerais<textarea data-g="obs" placeholder="Opcional">${esc(A.obs)}</textarea></label></div>`;
  barDraw(); }
function barDraw(){ const s=sum(), b=$('#bar'); b.hidden=false; b.innerHTML=`<div class="in"><div class="tt"><b>${brl(tot())}</b><small>${s.f||s.m?[s.m?s.m+' alteraç'+(s.m>1?'ões':'ão'):'',s.f?s.f+' em falta':''].filter(Boolean).join(' · '):'tudo como pedido'}</small></div><button type="button" class="go" id="go">Salvar e enviar</button></div>`; }
function redraw(k){ const el=$('#it'+k); if(el){ el.outerHTML=itemHTML(O.itens[k],k); } barDraw(); }
document.addEventListener('input',e=>{ const t=e.target; if(!A) return; if(t.dataset.k!=null){ const a=A.itens[+t.dataset.k]; if(t.dataset.f==='ob'){ a.ob=t.value; return; } a[t.dataset.f]=parseFloat(String(t.value).replace(',','.'))||0; barDraw(); clearTimeout(redraw.t); redraw.t=setTimeout(()=>{ const id=document.activeElement&&document.activeElement.dataset; const k=+t.dataset.k, f=t.dataset.f; redraw(k); const n=document.querySelector(`[data-k="${k}"][data-f="${f}"]`); if(n&&id&&id.k==k){ n.focus(); const v=n.value; n.value=''; n.value=v; } },700); } if(t.dataset.g){ A[t.dataset.g]=t.value; } });
document.addEventListener('click',async e=>{ const tu=e.target.closest('[data-turno]'); if(tu){ A.turno=tu.dataset.turno; document.querySelectorAll('[data-turno]').forEach(b=>{ const on=b.dataset.turno===A.turno; b.setAttribute('aria-pressed',on); b.style.cssText=on?'background:#e9f5ef;border-color:#9cc7ad;color:#237a55':''; }); return; } const n=e.target.closest('[data-no]'); if(n){ const k=+n.dataset.no; A.itens[k].no=!A.itens[k].no; redraw(k); return; }
  if(e.target.closest('#go')){ if(!A.data||!A.turno){ alert('Informe o dia e o turno (manhã ou tarde) em que você vai entregar.'); const d=document.querySelector('[data-g="data"]'); if(d) d.scrollIntoView({behavior:'smooth',block:'center'}); return; } A.entrega=dlabel(A.data,A.turno); const b=$('#go'); b.disabled=true; b.textContent='Enviando…';
    try{ const cl=await rpc('oc_responder',{p_token:TK,p:{itens:A.itens,entrega:A.entrega,data:A.data,turno:A.turno,nome:A.nome,obs:A.obs,total:tot()}}); enviado(cl,false); }
    catch(err){ b.disabled=false; b.textContent='Salvar e enviar'; alert('Não foi possível enviar: '+err.message); } }
  if(e.target.closest('[data-reabrir]')) abrir(); });
function enviado(cl,ap){ $('#bar').hidden=true; const s=O&&A?sum():{f:0,m:0};
  $('#app').innerHTML=HEAD(O.numero)+`<div class="msg"><div class="ic">✓</div><h2>${ap?'Ordem aprovada':'Resposta enviada'}</h2>
  ${cl?`<p><span class="pill ${cl}">${cl==='completa'?'atendimento completo':cl==='parcial'?'atendimento parcial':'com ressalvas'}</span></p>`:''}
  <p>${ap?'A The Soul Food Factory aprovou esta ordem. Você recebe a ordem de compra oficial, com o código de validação.':'A The Soul Food Factory já recebeu sua resposta e vai aprovar. Em seguida você recebe a ordem de compra oficial.'}</p>
  ${!ap&&(s.f||s.m)?`<p>${[s.m?s.m+' alteraç'+(s.m>1?'ões':'ão'):'',s.f?s.f+' item'+(s.f>1?'s':'')+' em falta':''].filter(Boolean).join(' · ')} · total ${brl(tot())}</p>`:''}
  ${ap?'':'<button type="button" class="lnk" data-reabrir="1">Ajustar a resposta</button>'}</div>`; }

/* ---------- OC oficial e validação (QR) ---------- */
async function validar(){ let v=null; try{ v=await rpc('oc_validar',{p_numero:VN,p_codigo:VC||''}); }catch(e){ return fail('Não consegui conferir agora','Tente de novo em instantes. ('+esc(e.message)+')'); }
  if(!v){ $('#app').innerHTML=HEAD(VN)+`<div class="msg"><div class="ic x">✕</div><h2>Ordem não validada</h2><p>Não existe ordem aprovada <b>${esc(VN)}</b> com este código. Não entregue mercadoria sem uma ordem válida e fale com a The Soul Food Factory.</p></div>`; return; }
  const it=v.itens||[], t=it.reduce((s,i)=>s+(i.no?0:(+i.q)*(+i.p)),0)||+v.total||0, dt=v.aprovada_em?new Date(v.aprovada_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  $('#app').innerHTML=HEAD(v.numero)+`<div class="vok"><i>✓</i><span>Ordem de compra válida · aprovada${v.aprovador?' por '+esc(v.aprovador):''} em ${dt}</span></div>
  <div class="doc"><div class="cond" style="margin-top:0"><div><small>Fornecedor</small><b>${esc(v.fornecedor)}</b>${v.contato?`<br><span style="color:var(--steel)">${esc(v.contato)}</span>`:''}</div><div><small>Entregar em</small><b>Av. Cel. Marcos, 1000</b><br><span style="color:var(--steel)">Pedra Redonda · Porto Alegre/RS</span></div>
   <div><small>Entrega</small><b>${esc(v.entrega||'')}</b></div><div><small>Condição de pagamento</small><b>${esc(v.pagamento||'')}</b></div></div>
   <table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Preço</th><th class="r">Total</th></tr></thead><tbody>${it.filter(i=>!i.no&&+i.q>0).map(i=>`<tr><td>${esc(i.n)}</td><td class="r">${nf(i.q)} ${esc(i.un||'')}</td><td class="r">${brl(i.p)}</td><td class="r">${brl(i.q*i.p)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total da ordem</td><td class="r">${brl(t)}</td></tr></tfoot></table>
   <div class="nf"><b>Importante:</b> informe o número <b>${esc(v.numero)}</b> na nota fiscal, no campo “Pedido de compra” (xPed) ou nas informações complementares. Sem esse número a mercadoria não é recebida.</div>
   ${v.obs?`<p style="margin-top:12px;color:var(--steel)">Obs.: ${esc(v.obs)}</p>`:''}
   <div class="foot"><div id="qr"></div><p>Código de validação <b>${esc(String(VC).toUpperCase())}</b>. Escaneie para conferir que esta ordem é autêntica e foi aprovada pela The Soul Food Factory. Somente ordens com código válido podem ser faturadas.</p></div></div>
  <button type="button" class="prt noprint" onclick="print()">Imprimir ou salvar em PDF</button>`;
  qr(location.href.split('#')[0]); }
function qr(u){ const go=()=>{ try{ const q=qrcode(0,'M'); q.addData(u); q.make(); $('#qr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }catch(_){ } };
  if(window.qrcode) return go(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload=go; document.head.appendChild(s); }

if(TK) abrir(); else if(VN) validar(); else if(/^#o\d/.test(location.hash||'')) location.replace('legacy.html'+location.hash); else fail('Link incompleto','Abra o link exatamente como chegou na mensagem.');
</script>
</body>
</html>
