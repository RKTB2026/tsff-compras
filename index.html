<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordem de compra · The Soul Food Factory</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f0e4;--paper:#fff;--ink:#2A2A3A;--brand:#060644;--steel:#5D5D72;--line:#E4E2EA;--ok:#237a55;--warn:#9a5a22;--neg:#a8432a;--wa:#25D366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f6f0e4;--paper:#fff;--ink:#2A2A3A}}
:root[data-theme="dark"]{--bg:#f6f0e4;--paper:#fff;--ink:#2A2A3A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Jost,system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:8px 0 16px;border-bottom:2px solid var(--brand)}
.hd .co{font:600 13px Jost;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.hd small{display:block;color:var(--steel);font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:400}
.hd .n{text-align:right}.hd .n span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.hd .n b{display:block;font:500 24px Fraunces,Georgia,serif;color:var(--brand)}
.intro{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0}
.intro h1{font:500 22px/1.2 Fraunces,Georgia,serif;color:var(--brand);margin:0 0 6px}
.intro p{margin:0;color:var(--steel);font-size:14px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:560px){.meta{grid-template-columns:1fr 1fr}}
.meta div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meta small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.meta b{font-size:14.5px}
.it{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.it.ch{border-color:#e6c48a;background:#fffaf0}.it.no{opacity:.6}
.it .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.it .t b{font-size:15px}.it .t span{font-size:13px;color:var(--steel);white-space:nowrap}
.it .g{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:10px;align-items:end}
.it label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--steel)}
.it input[type=number],.it input[type=text]{height:40px;border:1px solid #cfccd8;border-radius:10px;padding:0 10px;font:600 15px Jost;background:#fff;color:var(--ink);width:100%}
.it .nt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);height:40px;white-space:nowrap}
.it .nt input{width:18px;height:18px;accent-color:var(--neg)}
.it .ob{margin-top:8px}
.it .df{font-size:12.5px;font-weight:600;margin-top:6px}
.tot{position:sticky;bottom:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;box-shadow:0 -10px 30px -20px rgba(0,0,0,.3)}
.tot .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tot .r b{font:500 24px Fraunces,Georgia,serif;color:var(--brand)}
.tot .r small{color:var(--steel)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:560px){.f{grid-template-columns:1fr}}
.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--steel)}
.f input,.f textarea{border:1px solid #cfccd8;border-radius:10px;padding:9px 10px;font:500 15px Jost;background:#fff;color:var(--ink)}
.f .full{grid-column:1/-1}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bt a{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:12px;font:600 16px Jost;text-decoration:none;color:#fff}
.bt .wa{background:var(--wa)}.bt .fin{all:unset;box-sizing:border-box;width:100%;text-align:center;padding:15px;border-radius:12px;font:600 17px Jost;color:#fff;background:#060644;cursor:pointer}.sent{text-align:center;padding:60px 22px}.sent .ck{width:72px;height:72px;border-radius:50%;background:#2f7a55;color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 16px}.sent h1{font:600 26px Fraunces,serif;margin:0 0 8px}.sent p{color:#55556a}.bt .em{background:var(--brand)}
.err{background:var(--paper);border-radius:16px;padding:24px;text-align:center;margin-top:30px}
.ok{color:var(--ok);font-weight:600;font-size:14px;margin-top:10px;text-align:center}
</style>
</head><body><div class="w" id="app"><div class="err"><b>Abrindo a ordem de compra…</b></div></div>
<script>

"maionese": ["Maionese", "kg"], "vagem": ["Vagem", "kg"], "condensado": ["Leite condensado", "kg"], "amido": ["Amido de milho", "kg"], "refri2l": ["Refrigerante 2 L", "un"], "aguagas": ["Água mineral com gás 500 ml", "un"], "cervlata": ["Cerveja pilsen lata 350 ml", "un"], "longneck": ["Cerveja premium long neck 330 ml", "un"], "weisswurst": ["Weißwurst", "kg"], "bratwurst": ["Nürnberger Bratwurst", "kg"], "bockwurst": ["Bockwurst", "kg"], "joelho": ["Joelho de porco defumado", "kg"], "lombo": ["Lombo suíno", "kg"], "filesuino": ["Filé mignon suíno", "kg"], "musculo": ["Músculo / acém em cubos", "kg"], "coxao": ["Coxão mole", "kg"], "mignon": ["Filé mignon bovino", "kg"], "bacon": ["Bacon em manta", "kg"], "pepino": ["Pepino em conserva", "kg"], "chucrute": ["Chucrute", "kg"], "repolhoroxo": ["Repolho roxo", "kg"], "mostardadoce": ["Mostarda doce bávara", "kg"], "mostarda": ["Mostarda escura", "kg"], "rosca": ["Farinha de rosca / panko", "kg"], "vinagre": ["Vinagre de vinho tinto", "L"], "vinho": ["Vinho tinto seco", "L"], "emmental": ["Queijo emmental / gruyère nacional", "kg"], "ricota": ["Ricota fresca", "kg"], "maca": ["Maçã gala/fuji", "kg"], "folhada": ["Massa folhada congelada", "kg"], "fermento": ["Fermento biológico seco", "kg"], "bicarbonato": ["Bicarbonato de sódio", "kg"], "salgrosso": ["Sal grosso", "kg"], "sucouva": ["Suco de uva integral 300 ml", "un"], "cervart": ["Cerveja artesanal gaúcha 500 ml", "un"], "refl6": ["Refrigerante lata 350 ml", "un"], "ref600": ["Refrigerante 600 ml", "un"], "ref2l": ["Refrigerante 2 L", "un"], "agua6": ["Água mineral sem gás 600 ml", "un"], "aguagas6": ["Água mineral com gás 600 ml", "un"], "erding": ["Erdinger Weissbier 500 ml", "un"], "paulaner": ["Paulaner Hefe-Weißbier 500 ml", "un"], "frutasverm": ["Mix de frutas vermelhas congelado", "kg"], "mascavo": ["Açúcar mascavo", "kg"], "nozes": ["Nozes sem casca, quartz", "kg"], "avela": ["Avelã sem casca", "kg"], "chocolate": ["Chocolate meio amargo", "kg"], "sorvete": ["Sorvete de creme", "L"], "camembert": ["Queijo camembert nacional", "kg"], "raizforte": ["Raiz-forte em conserva", "kg"], "alho": ["Alho", "kg"], "pimenta": ["Pimenta vermelha fresca", "kg"], "coentro": ["Coentro", "kg"], "folhas": ["Folhas verdes", "kg"], "pepfresco": ["Pepino japonês", "kg"], "baunilha": ["Essência de baunilha", "L"], "potevidro": ["Pote de vidro 200–300 ml com tampa metálica", "un"], "etiqueta": ["Etiqueta kraft com barbante", "un"], "potinho": ["Potinho 50 ml com tampa", "un"], "pote250": ["Pote 250 ml com tampa", "un"], "repolho": ["Repolho branco", "kg"]};
const FS={hort:['Hortifrúti Serra Gaúcha','Jorge (teste)','7 dias'],merc:['Atacado Zona Sul','Fernanda','14 dias'],lat:['Laticínios Vale do Taquari','Rogério','14 dias'],carn:['Frigorífico Cavalhada','Seu Paulo','7 dias'],pei:['Pescados Guaíba','Joana','7 dias'],beb:['Distribuidora Bebidas POA','Ricardo','21 dias'],pao:['Padaria parceira','Dona Lurdes','semanal']};
const BUY={wa:'5551992626734',em:'jzwingel74@gmail.com',back:'https://claude.ai/artifact/WnSbCeXQaF6FDig2DLzin8'};
const DS=['dom','seg','ter','qua','qui','sex','sáb'];
function ddmm(s){ const m=String(s).match(/(\d{1,2})\D(\d{1,2})/); return m?m[1].padStart(2,'0')+m[2].padStart(2,'0'):''; }
function dlab(d){ if(!/^\d{4}$/.test(d)) return d||''; const y=new Date().getFullYear(), dt=new Date(y,+d.slice(2)-1,+d.slice(0,2)); return DS[dt.getDay()]+' '+d.slice(0,2)+'/'+d.slice(2); }
const nn=v=>String(+(+v).toFixed(2));
function dec(h){ const [n,f,d,its]=h.split('-'); const fs=FS[f]||[f,'',''], nw=!/~/.test(its||'');
  const it=nw?(its||'').split('.').filter(Boolean).map(s=>{ const [id,q,p]=s.split('_'); const c=CAT[id]||[id,'un']; return [id,c[0],(+q||0)/100,c[1],(+p||0)/100]; }):(its||'').split('_').filter(Boolean).map(s=>{ const [id,q,p]=s.split('~'); const c=CAT[id]||[id,'un']; return [id,c[0],+q,c[1],+p]; });
  return {n:'OC-'+new Date().getFullYear()+'-'+String(n).padStart(4,'0'),num:n,f:fs[0],ct:fs[1],pg:fs[2],pv:dlab(d),it}; }
let O=null, A=null; const SIM=/[?&]sim=1/.test(location.search)&&window.parent!==window;
function load(){ const H=decodeURIComponent(location.hash||''); const old=H.match(/oc=([A-Za-z0-9_-]{20,})/);
  if(old){ try{ const o=JSON.parse(decodeURIComponent(escape(atob(old[1].replace(/-/g,'+').replace(/_/g,'/'))))); location.hash='o'+String(o.n).replace(/\D/g,'').replace(/^20\d\d0*/,'')+'-hort-'+ddmm(o.pv)+'-'+o.it.map(i=>i[0]+'~'+nn(i[2])+'~'+nn(i[4])).join('_'); return; }catch(_){} }
  const m=H.match(/^#o([0-9][A-Za-z0-9_.~-]*)/); if(!m){ document.getElementById('app').innerHTML='<div class="err"><b>Este link está incompleto.</b><p>Ele chegou sem os itens da ordem. Cole abaixo o link inteiro da mensagem, ou peça para a The Soul Food Factory reenviar.</p><p style="font-size:12px;color:#6E6E84;word-break:break-all">Recebido: '+esc(location.href.replace(/^https?:\/\/[^/]+/,''))+'</p><div style="display:flex;gap:8px;margin-top:10px"><input id="pst" placeholder="cole o link aqui" style="flex:1;height:40px;border:1px solid #cfccd8;border-radius:10px;padding:0 10px;font:15px Jost"><button onclick="var v=document.getElementById(\'pst\').value,i=v.indexOf(\'#o\');if(i>-1){location.hash=v.slice(i+1);}" style="height:42px;border:0;border-radius:10px;background:#060644;color:#fff;padding:0 16px;font:600 14px Jost">Abrir</button></div></div>'; return; }
  try{ O=dec(m[1]); if(!O.it.length) throw 0; }catch(e){ document.getElementById('app').innerHTML='<div class="err"><b>Não consegui ler esta ordem.</b><p>Peça o link de novo para a The Soul Food Factory.</p></div>'; return; }
  let saved=null; try{ saved=JSON.parse(localStorage.getItem('oc-'+O.n)||'null'); }catch(_){}
  A=saved&&saved.it&&saved.it.length===O.it.length?saved:{it:O.it.map(i=>({q:i[2],p:i[4],no:false,ob:''})),dt:O.pv||'',nm:O.ct||'',obs:''}; draw(); }
function save(){ try{ localStorage.setItem('oc-'+O.n,JSON.stringify(A)); }catch(_){} }
function tot(){ return O.it.reduce((a,i,k)=>a+(A.it[k].no?0:(+A.it[k].q||0)*(+A.it[k].p||0)),0); }
function msg(){ const ch=O.it.map((i,k)=>{ const a=A.it[k]; if(a.no) return `• ${i[1]}: NÃO TENHO`; const d=[]; if(+a.q!==+i[2]) d.push(`${nf(a.q)} ${i[3]} (pedido ${nf(i[2])})`); if(+a.p!==+i[4]) d.push(`preço ${brl(a.p)} (era ${brl(i[4])})`); return d.length?`• ${i[1]}: ${d.join(' · ')}`:''; }).filter(Boolean);
  const link='#r'+O.num+'-'+ddmm(A.dt||O.pv)+'-'+O.it.map((i,k)=>{ const x=A.it[k]; return i[0]+'_'+(x.no?0:Math.round(x.q*100))+'_'+Math.round(x.p*100)+(x.no?'_x':''); }).join('.');
  return `Resposta à ordem de compra ${O.n} (${O.f})\n${ch.length?'Alterações:\n'+ch.join('\n'):'Confirmo todos os itens, quantidades e preços.'}\nTotal: ${brl(tot())}\nEntrega: ${A.dt||O.pv}\n${A.obs?'Obs.: '+A.obs+'\n':''}Responsável: ${A.nm}\n\nCódigo da resposta (cole em Compras, no planner):\n${link}`; }
function draw(){ const t=tot(), t0=O.it.reduce((a,i)=>a+i[2]*i[4],0);
  document.getElementById('app').innerHTML=`<div class="hd"><div class="co">The Soul Food Factory<small>Av. Cel. Marcos, 1000 · Porto Alegre/RS</small></div><div class="n"><span>Ordem de compra</span><b>${esc(O.n)}</b></div></div>
  <div class="intro"><h1>Olá, ${esc(O.ct||'fornecedor')}!</h1><p>Confira o pedido. Se for entregar outra quantidade ou o preço mudou, ajuste no item. Depois toque em “${SIM?'Finalizar e enviar':'Enviar resposta'}”. A gente aprova e você recebe a confirmação.</p></div>
  <div class="meta"><div><small>Fornecedor</small><b>${esc(O.f)}</b></div><div><small>Entrega pedida</small><b>${esc(O.pv)}</b></div><div><small>Pagamento</small><b>${esc(O.pg||'')}</b></div></div>
  ${O.it.map((i,k)=>{ const a=A.it[k], ch=a.no||+a.q!==+i[2]||+a.p!==+i[4]; return `<div class="it ${ch?'ch':''} ${a.no?'no':''}"><div class="t"><b>${esc(i[1])}</b><span>pedido ${nf(i[2])} ${esc(i[3])} · ${brl(i[4])}</span></div>
    <div class="g"><label>Vou entregar (${esc(i[3])})<input type="number" min="0" step="any" inputmode="decimal" data-k="${k}" data-f="q" value="${a.q}" ${a.no?'disabled':''}></label><label>Preço por ${esc(i[3])} (R$)<input type="number" min="0" step="0.01" inputmode="decimal" data-k="${k}" data-f="p" value="${a.p}" ${a.no?'disabled':''}></label><label class="nt"><input type="checkbox" data-k="${k}" data-f="no" ${a.no?'checked':''}>Não tenho</label></div>
    <div class="ob"><input type="text" data-k="${k}" data-f="ob" value="${esc(a.ob)}" placeholder="Observação (opcional)" style="height:36px;font-weight:400;border:1px solid #e1dfe8;border-radius:10px;padding:0 10px;width:100%;font:400 14px Jost"></div>
    ${ch&&!a.no?`<div class="df" style="color:var(--warn)">Alterado: ${+a.q!==+i[2]?`quantidade ${nf(i[2])} → ${nf(a.q)}`:''}${+a.q!==+i[2]&&+a.p!==+i[4]?' · ':''}${+a.p!==+i[4]?`preço ${brl(i[4])} → ${brl(a.p)}`:''}</div>`:''}</div>`; }).join('')}
  <div class="f"><label>Data de entrega<input data-g="dt" value="${esc(A.dt)}" placeholder="ex. seg 02/11"></label><label>Seu nome<input data-g="nm" value="${esc(A.nm)}"></label><label class="full">Observações gerais<textarea data-g="obs" rows="2" placeholder="Opcional">${esc(A.obs)}</textarea></label></div>
  <div class="tot"><div class="r"><span>Total da resposta<br><small>pedido original ${brl(t0)}</small></span><b id="tt">${brl(t)}</b></div>
   ${SIM?'<div class="bt"><button type="button" class="fin" id="sfin">Finalizar e enviar</button></div>':'<div class="bt"><a class="wa" id="sw" href="#" target="_blank" rel="noopener">Enviar resposta no WhatsApp</a><a class="em" id="se" href="#" target="_blank" rel="noopener">Enviar por e-mail</a></div><div class="ok" id="okm" hidden>Resposta pronta. Confira e envie na conversa que abriu.</div>'}</div>`;
  links(); }
function links(){ const m=msg(); const w=document.getElementById('sw'), e=document.getElementById('se'); if(w) w.href='https://wa.me/'+BUY.wa+'?text='+encodeURIComponent(m); if(e) e.href='mailto:'+BUY.em+'?subject='+encodeURIComponent('Resposta '+O.n)+'&body='+encodeURIComponent(m); const tt=document.getElementById('tt'); if(tt) tt.textContent=brl(tot()); }
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.k!=null){ const a=A.it[+t.dataset.k]; if(t.dataset.f==='no') return; a[t.dataset.f]=t.dataset.f==='ob'?t.value:(parseFloat(t.value)||0); save(); links(); clearTimeout(draw.t); if(t.dataset.f!=='ob') draw.t=setTimeout(()=>{ const id=t.dataset.k+t.dataset.f; draw(); const n=document.querySelector(`[data-k="${t.dataset.k}"][data-f="${t.dataset.f}"]`); if(n){ n.focus(); } },900); return; } if(t.dataset.g){ A[t.dataset.g]=t.value; save(); links(); } });
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.f==='no'){ A.it[+t.dataset.k].no=t.checked; save(); draw(); } });
document.addEventListener('click',e=>{ if(e.target.closest('#sfin')){ parent.postMessage({t:'tsffOcResp',n:O.num,it:A.it.map(x=>[x.no?0:+x.q,+x.p,x.no?1:0,x.ob||'']),dt:A.dt,nm:A.nm,obs:A.obs},'*'); const ch=O.it.filter((i,k)=>A.it[k].no||+A.it[k].q!==+i[2]||+A.it[k].p!==+i[4]).length; document.getElementById('app').innerHTML=`<div class="sent"><div class="ck">✓</div><h1>Resposta enviada</h1><p>${ch?ch+' alteraç'+(ch>1?'ões':'ão')+' enviada'+(ch>1?'s':'')+'.':'Você confirmou todos os itens.'} A The Soul Food Factory já foi avisada e manda a confirmação final.</p><p><b>${esc(O.n)}</b> · total ${brl(tot())}</p></div>`; return; } if(e.target.closest('#sw,#se')){ const o=document.getElementById('okm'); if(o) o.hidden=false; } });
addEventListener('hashchange',load); load();
</script>
