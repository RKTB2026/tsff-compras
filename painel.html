<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel de Compras · The Soul Food Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f0e4;--paper:#fff;--ink:#2A2A3A;--brand:#060644;--steel:#5D5D72;--faint:#8a889c;--line:#E4E2EA;--line2:#cfccd8;--cob:#B87333;--ok:#237a55;--ok-s:#e9f5ef;--warn:#9a5a22;--warn-s:#fbf3e6;--neg:#a8432a;--neg-s:#fbeee9;--band:#f6f0e4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1.5px solid var(--brand);flex-wrap:wrap}
.hd img{height:36px;display:block}
.hd .t{font:500 22px Fraunces,Georgia,serif;color:var(--brand)}
.hd .r{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--steel)}
button,.b{all:unset;box-sizing:border-box;cursor:pointer;font:600 14px Jost;padding:9px 16px;border-radius:999px;background:var(--brand);color:#fff;text-align:center;display:inline-block}
.b.gh,button.gh{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.b.wa{background:#25D366;color:#fff}
button[disabled]{opacity:.5;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
h1{font:500 28px/1.15 Fraunces,Georgia,serif;color:var(--brand);margin:20px 0 4px}
h2{font:500 22px Fraunces,Georgia,serif;color:var(--brand);margin:0 0 6px}
.cap{color:var(--steel);font-size:13px}
input.in{height:44px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;font:500 15px Jost;width:100%;max-width:320px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.al{display:flex;gap:12px;align-items:center;background:#fff8e8;border:1px solid #e9c98f;border-radius:16px;padding:12px 14px;cursor:pointer}
.al .bl{width:36px;height:36px;border-radius:50%;background:var(--cob);color:#fff;display:grid;place-items:center;flex:none}
.al small{display:block;color:var(--steel)}
.al .sp{flex:1}
.pill{display:inline-block;font:600 11px Jost;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:1px}
.pill.completa{background:var(--ok-s);color:var(--ok)}.pill.parcial{background:var(--neg-s);color:var(--neg)}.pill.ressalva{background:var(--warn-s);color:var(--warn)}
.pill.enviada{background:#eceaf3;color:var(--steel)}.pill.aprovada{background:var(--ok-s);color:var(--ok)}.pill.recebida{background:var(--ok-s);color:var(--ok)}.pill.cancelada{background:#eee;color:#888}.pill.respondida{background:var(--warn-s);color:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line2);font-weight:500;padding:7px 14px}
.tabs button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.tabs em{font-style:normal;opacity:.7;margin-left:4px}
.list{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:150px 1fr 120px 130px 150px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}.row:hover{background:#fbf9f4}
.row b{font-weight:600}.row .r{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:760px){.row{grid-template-columns:1fr auto}.row .hm{display:none}}
.empty{padding:20px;color:var(--steel)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--brand)}
td{padding:8px 6px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;white-space:nowrap}
td.ch{color:var(--warn);font-weight:600}td.no{color:var(--neg);font-weight:600}
tr.rj td:not(.c){opacity:.4;text-decoration:line-through}
td.c{width:46px;text-align:center}td.c input{width:18px;height:18px;accent-color:var(--ok)}
tfoot td{font-weight:600;border:0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.off{border:1.5px solid var(--ok);background:#f4faf6;border-radius:16px;padding:14px;margin-top:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.off .qr{width:96px;height:96px;background:#fff;border-radius:8px;padding:4px;flex:none}.off .qr svg{width:100%;height:100%}
.off h3{margin:0 0 4px;font:600 15px Jost;color:var(--ok)}
.falta{border:1px solid #e6b9ad;background:var(--neg-s);border-radius:14px;padding:12px 14px;margin-top:12px}
.falta h4{margin:0 0 6px;color:var(--neg);font:600 14px Jost}
.falta ul{margin:0;padding-left:18px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.meta div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}.meta small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
@media(max-width:760px){.meta{grid-template-columns:1fr 1fr}}
.tl{margin-top:14px;font-size:13px;color:var(--steel);display:flex;flex-direction:column;gap:3px}
.nb{all:unset;position:relative;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;font-size:18px}
.nb em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--neg);color:#fff;font:600 11px/18px Jost;text-align:center;padding:0 4px;font-style:normal}
.uc{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--line2);background:#fff;font:500 14px Jost;color:var(--ink)}
.uc i{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:600 13px Jost;font-style:normal}
.dd{position:absolute;right:16px;top:64px;z-index:20;width:min(400px,calc(100vw - 32px));background:#fff;border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 50px rgba(6,6,68,.18);overflow:hidden}
.dd h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font:600 14px Jost;display:flex;justify-content:space-between;align-items:center}
.dd h4 button{all:unset;cursor:pointer;font:500 12.5px Jost;color:var(--brand);text-decoration:underline}
.dd .ls{max-height:420px;overflow:auto}
.ni{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}.ni:first-child{border-top:0}.ni:hover{background:#fbf9f4}
.ni.un{background:#fff8e8}.ni .ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;background:#eceaf3}
.ni.oc_resposta .ic{background:var(--cob);color:#fff}.ni.oc_aprovada .ic{background:var(--ok);color:#fff}
.ni b{display:block;font-weight:600;font-size:14px}.ni small{color:var(--steel);font-size:12.5px}
.dd .mi{display:block;width:100%;all:unset;box-sizing:border-box;cursor:pointer;padding:11px 14px;border-top:1px solid var(--line);font:500 14px Jost;width:100%}.dd .mi:hover{background:#fbf9f4}
.hd{position:relative}
.ut{width:100%;border-collapse:collapse}.ut td,.ut th{padding:10px 6px}
.fm{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-top:12px}.fm input{height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 10px;font:500 14px Jost;width:100%}
@media(max-width:760px){.fm{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:96px;min-width:0}
.cal .d.today{border-color:var(--brand)}.cal .d.we{background:#faf8f3}
.cal .d h5{margin:0 0 4px;font:600 12px Jost;color:var(--steel);text-transform:capitalize}
.cal .s{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.cal .c{display:block;all:unset;box-sizing:border-box;cursor:pointer;width:100%;margin-top:3px;padding:4px 6px;border-radius:7px;background:#eef2fb;border-left:3px solid var(--brand);font:500 11.5px/1.25 Jost;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .c.rec{background:var(--ok-s);border-left-color:var(--ok)}
@media(max-width:760px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const SB='https://zumcshmqwwhvlnsdtpjo.supabase.co', KEY='sb_publishable_RxGIQftz2ECn83uEQvsrmg_NEbq2u6J', WEB=location.origin+location.pathname.replace(/painel\.html$/,'');
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const LS={get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(_){ return d; } },set:(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){ } }};
const CL={completa:'completa',parcial:'parcial',ressalva:'com ressalva'};
async function rpc(fn,args){ const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)}); const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(_){ } if(!r.ok) throw new Error((j&&(j.message||j.hint))||('erro '+r.status)); return j; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
let TAB_SET=false, PASS=LS.get('tsff-tok',''), ME=null, NOTIFS=[], DD=null, VIEW='oc', ROWS=[], TAB='resp', SEL=null, NOVA=null, CONT=LS.get('tsff-oc-cont',{});
const HEAD=()=>{ const un=NOTIFS.filter(n=>!n.lida).length; return `<div class="hd"><span style="display:flex;align-items:center;gap:12px"><button class="gh" data-planner="1" style="padding:7px 12px">← Planner</button><img src="logo-h.png" alt="The Soul Food Factory"></span><span class="t">TSFF · Operação</span><span class="r">${PASS&&ME?`<button class="nb" data-dd="n" aria-label="Notificações">🔔${un?`<em>${un}</em>`:''}</button><button class="uc" data-dd="u"><i>${esc((ME.nome||'?').split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase())}</i>${esc((ME.nome||'').split(' ')[0])}</button>`:''}</span>${DD==='n'?`<div class="dd"><h4>Notificações ${un?'<button data-nall="1">marcar todas como lidas</button>':''}</h4><div class="ls">${NOTIFS.length?NOTIFS.map(n=>`<div class="ni ${n.tipo} ${n.lida?'':'un'}" data-ni="${n.id}"><span class="ic">${n.tipo==='oc_resposta'?'🔔':n.tipo==='oc_aprovada'?'✓':'•'}</span><div><b>${esc(n.titulo)}</b><small>${esc(n.texto||'')} · ${dt(n.created_at)}</small></div></div>`).join(''):'<div class="empty">Nenhuma notificação ainda.</div>'}</div></div>`:''}${DD==='u'?`<div class="dd" style="width:280px"><h4>${esc(ME.nome)}<small style="font-weight:400;color:var(--steel)">${esc(ME.papel)}</small></h4><button class="mi" data-view="oc">Ordens de compra</button><button class="mi" data-view="us">Usuários</button><button class="mi" data-view="pw">Trocar minha senha</button><button class="mi" data-sair="1">Sair</button></div>`:''}</div>`; };
function decNova(){ const m=(location.hash||'').match(/nova=([A-Za-z0-9_-]+)/); if(!m) return null; try{ return JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))))); }catch(_){ return null; } }

/* login */
var LEG=false;
function loginLeg(err){ LEG=true; $('#app').innerHTML=HEAD()+`<div class="card" style="max-width:460px;margin:40px auto"><h2>Entrar</h2><p class="cap">Use a mesma senha de compras de antes.</p><p><input class="in" type="password" id="pw" placeholder="senha de compras"></p>${err?`<p style="color:var(--neg)">${esc(err)}</p>`:''}<button data-entrarleg="1">Entrar</button></div>`; setTimeout(()=>{ const i=$('#pw'); if(i) i.focus(); },50); }
async function entrarLeg(){ const p=($('#pw')||{}).value||''; if(p.length<6) return loginLeg('A senha tem pelo menos 6 caracteres.'); try{ const ok=await rpc('oc_setup',{p_senha:p}); if(!ok) return loginLeg('Senha incorreta.'); LS.set('tsff-oc-pass',p); PASS=p; ME=null; LEG=true; NOVA=decNova(); await load(); }catch(e){ loginLeg(e.message); } }
async function login(err){ let tem=true; try{ tem=await rpc('u_tem_usuarios',{}); }catch(e){ if(/u_tem_usuarios|schema cache|404/.test(e.message)){ const op=LS.get('tsff-oc-pass',''); if(op){ PASS=op; LEG=true; NOVA=decNova(); return load(); } return loginLeg(); } }
  $('#app').innerHTML=HEAD()+(tem?`<div class="card" style="max-width:460px;margin:40px auto"><h2>Entrar</h2><p><input class="in" id="em" type="email" placeholder="e-mail" autocomplete="username"></p><p><input class="in" type="password" id="pw" placeholder="senha" autocomplete="current-password"></p>${err?`<p style="color:var(--neg)">${esc(err)}</p>`:''}<button data-entrar="1">Entrar</button></div>`
   :`<div class="card" style="max-width:460px;margin:40px auto"><h2>Criar o primeiro usuário</h2><p class="cap">Você será o usuário master. Depois você cadastra a equipe em Usuários.</p><p><input class="in" id="nm" placeholder="seu nome"></p><p><input class="in" id="em" type="email" placeholder="e-mail"></p><p><input class="in" type="password" id="pw" placeholder="senha (mínimo 6)"></p>${err?`<p style="color:var(--neg)">${esc(err)}</p>`:''}<button data-primeiro="1">Criar e entrar</button></div>`); setTimeout(()=>{ const i=$('#nm')||$('#em'); if(i) i.focus(); },50); }
async function entrar(primeiro){ const em=($('#em')||{}).value||'', pw=($('#pw')||{}).value||'', nm=($('#nm')||{}).value||'';
  try{ PASS=primeiro?await rpc('u_primeiro',{p_nome:nm||em,p_email:em,p_senha:pw}):await rpc('u_login',{p_email:em,p_senha:pw}); LS.set('tsff-tok',PASS); start(); }catch(e){ login(e.message); } }
async function me(){ ME=await rpc('u_eu',{p_tok:PASS}); if(!ME) throw new Error('sem permissão'); }
async function notifs(silent){ try{ const old=new Set(NOTIFS.map(n=>n.id)); const L=await rpc('n_lista',{p_tok:PASS})||[]; const nov=L.filter(n=>!n.lida&&!old.has(n.id)); NOTIFS=L;
  if(silent&&old.size&&nov.length){ toast(nov[0].titulo); try{ if(Notification.permission==='granted') new Notification(nov[0].titulo,{body:nov[0].texto||''}); }catch(_){ } } }catch(_){ } }
async function ler(ids){ if(!ids.length) return; try{ await rpc('n_ler',{p_tok:PASS,p_ids:ids}); }catch(_){ } NOTIFS.forEach(n=>{ if(ids.includes(n.id)) n.lida=true; }); }

/* dados */
async function load(silent){ try{ await notifs(silent); const r=await rpc('oc_lista',{p_senha:PASS}); const before=new Set(ROWS.filter(x=>x.status==='respondida').map(x=>x.token+x.respondido_em)); ROWS=r||[];
  const novos=ROWS.filter(x=>x.status==='respondida'&&!before.has(x.token+x.respondido_em)); if(silent&&novos.length){ toast(`${novos[0].contato||novos[0].fornecedor} respondeu à ${novos[0].numero}`); try{ if(Notification.permission==='granted') new Notification('Fornecedor respondeu',{body:`${novos[0].fornecedor} · ${novos[0].numero} · ${CL[novos[0].classe]||''}`}); }catch(_){ } }
  document.title=(ROWS.filter(x=>x.status==='respondida').length?'('+ROWS.filter(x=>x.status==='respondida').length+') ':'')+'Painel de Compras · TSFF'; draw(); }
  catch(e){ if(/permiss/.test(e.message)){ PASS=''; LS.set('tsff-tok',''); if(LEG){ LS.set('tsff-oc-pass',''); return loginLeg('Senha incorreta.'); } login('Sua sessão expirou. Entre de novo.'); } else if(!silent) $('#app').innerHTML=HEAD()+`<div class="card">Não consegui falar com o banco: ${esc(e.message)}</div>`; } }
function odata(o){ const A=o.aprovacao||{}, R=o.resposta||{}; let d=A.data||R.data||''; if(!d){ const m=String(A.entrega||R.entrega||o.entrega||'').match(/(\d{1,2})\/(\d{1,2})/); if(m){ const n=new Date(); d=n.getFullYear()+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); } } return {d,t:A.turno||R.turno||''}; }
function dl(d,tu){ if(!d) return 'sem data'; const x=new Date(d+'T12:00:00'); return ['dom','seg','ter','qua','qui','sex','sáb'][x.getDay()]+' '+d.slice(8,10)+'/'+d.slice(5,7)+(tu?' · '+tu:''); }
function calHTML(L){ const days=[], t0=new Date(); t0.setHours(12,0,0,0); for(let i=0;i<14;i++){ const x=new Date(t0.getTime()+i*864e5); days.push(x.toISOString().slice(0,10)); } const td=days[0];
  const sem=L.filter(o=>!odata(o).d);
  return `<div class="cal">${days.map(d=>{ const x=new Date(d+'T12:00:00'), w=x.getDay(); const ch=tu=>L.filter(o=>{ const z=odata(o); return z.d===d&&(z.t||'manhã')===tu; }).map(o=>`<button class="c ${o.status==='recebida'?'rec':''}" data-oc="${o.token}" title="${esc(o.fornecedor)} · ${esc(o.numero)}">${o.status==='recebida'?'✓ ':''}${esc(o.fornecedor)}</button>`).join(''); return `<div class="d ${d===td?'today':''} ${w===0||w===6?'we':''}"><h5>${d===td?'hoje':['dom','seg','ter','qua','qui','sex','sáb'][w]} ${d.slice(8,10)}/${d.slice(5,7)}</h5><div class="s">manhã</div>${ch('manhã')}<div class="s">tarde</div>${ch('tarde')}</div>`; }).join('')}</div>${sem.length?`<p class="cap" style="margin-top:8px">Sem data de entrega: ${sem.map(o=>esc(o.fornecedor)+' ('+esc(o.numero)+')').join(', ')}</p>`:''}`; }
function tot(it){ return (it||[]).reduce((a,i)=>a+(i.no?0:(+i.q)*(+i.p)),0); }

/* tela principal */
function draw(){ if(VIEW==='us') return drawUs(); if(VIEW==='pw') return drawPw(); if(SEL) return drawOC(); if(NOVA) return drawNova();
  const R=ROWS, resp=R.filter(x=>x.status==='respondida'), env=R.filter(x=>x.status==='enviada'), apr=R.filter(x=>x.status==='aprovada'), rec=R.filter(x=>x.status==='recebida'), can=R.filter(x=>x.status==='cancelada');
  if(!TAB_SET){ TAB=resp.length?'resp':apr.length?'apr':env.length?'env':'resp'; }
  const L={resp,env,apr,rec,can}[TAB]||[];
  $('#app').innerHTML=HEAD()+`<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h1>Ordens de compra</h1><p class="cap">As respostas dos fornecedores chegam aqui sozinhas. A tela atualiza a cada 30 segundos.</p></div><button class="gh" data-sync="1" title="Copia a situação das ordens para colar no planner">Atualizar o planner</button></div>
  ${resp.length?`<div class="alerts">${resp.map(o=>`<div class="al" data-oc="${o.token}"><span class="bl">🔔</span><div><b>${esc(o.contato||o.fornecedor)}</b> (${esc(o.fornecedor)}) respondeu à <b>${esc(o.numero)}</b><span class="pill ${o.classe}">${CL[o.classe]||''}</span><small>${dt(o.respondido_em)} · total ${brl(o.resposta&&o.resposta.total!=null?o.resposta.total:o.total)}</small></div><span class="sp"></span><button>${o.classe==='completa'?'Aprovar':'Conferir e aprovar'}</button></div>`).join('')}</div>`:''}
  ${apr.length||rec.length?`<div class="card" style="margin-top:16px"><h2>Entregas dos próximos 14 dias</h2><p class="cap">Dia e turno que o fornecedor confirmou. Toque numa entrega para abrir a ordem.</p>${calHTML(R.filter(x=>x.status==='aprovada'||x.status==='recebida'))}</div>`:''}
  <div class="tabs">${[['resp','Respostas para aprovar',resp.length],['env','Aguardando fornecedor',env.length],['apr','A chegar',apr.length],['rec','Recebidas',rec.length],['can','Canceladas',can.length]].map(([k,l,n])=>`<button data-tab="${k}" aria-pressed="${TAB===k}">${l}<em>${n}</em></button>`).join('')}</div>
  <div class="list">${L.length?L.map(o=>`<div class="row" data-oc="${o.token}"><b>${esc(o.numero)}</b><span>${esc(o.fornecedor)}<span class="pill ${o.status==='respondida'?o.classe:o.status}">${o.status==='respondida'?CL[o.classe]:o.status}</span></span><span class="hm">${o.status==="aprovada"||o.status==="recebida"||o.status==="respondida"?esc(dl(odata(o).d,odata(o).t)):esc(o.entrega||"")}</span><span class="r">${brl(o.aprovacao?o.aprovacao.total:o.total)}</span><span class="r hm cap">${dt(o.aprovada_em||o.respondido_em||o.created_at)}</span></div>`).join(''):'<div class="empty">Nada aqui.</div>'}</div>
  ${'Notification' in window&&Notification.permission==='default'?'<p class="cap" style="margin-top:14px"><button class="gh" data-notif="1">Avisar no computador quando um fornecedor responder</button></p>':''}`; }

/* usuários */
let USERS=[];
async function drawUs(err){ try{ USERS=await rpc('u_lista',{p_tok:PASS}); }catch(e){ err=e.message; }
  $('#app').innerHTML=HEAD()+`<p style="margin-top:14px"><button class="gh" data-view="oc">← Ordens de compra</button></p><h1>Usuários</h1><p class="cap">Por enquanto todos são master: veem e aprovam tudo. Os níveis de acesso entram depois.</p>
  <div class="card"><table class="ut"><thead><tr><th>Nome</th><th>E-mail</th><th>Nível</th><th>Desde</th><th class="r">Situação</th></tr></thead><tbody>${USERS.map(u=>`<tr><td><b>${esc(u.nome)}</b>${u.id===ME.id?' <span class="cap">(você)</span>':''}</td><td>${esc(u.email)}</td><td>${esc(u.papel)}</td><td class="cap">${dt(u.desde)}</td><td class="r">${u.id===ME.id?'<span class="pill aprovada">ativo</span>':`<button class="gh" data-uat="${u.id}" data-v="${!u.ativo}">${u.ativo?'Desativar':'Reativar'}</button>`}</td></tr>`).join('')}</tbody></table>
  <h2 style="margin-top:22px">Novo usuário</h2><div class="fm"><input id="unm" placeholder="nome"><input id="uem" type="email" placeholder="e-mail"><input id="upw" type="text" placeholder="senha inicial (mín. 6)"><button data-unovo="1">Cadastrar</button></div>${err?`<p style="color:var(--neg)">${esc(err)}</p>`:''}<p class="cap">Passe o e-mail e a senha inicial para a pessoa. Ela entra pelo mesmo endereço e pode trocar a senha no menu dela.</p></div>`; }
function drawPw(err,ok){ $('#app').innerHTML=HEAD()+`<p style="margin-top:14px"><button class="gh" data-view="oc">← Ordens de compra</button></p><h1>Trocar minha senha</h1><div class="card" style="max-width:460px"><p><input class="in" type="password" id="np" placeholder="nova senha (mínimo 6)"></p>${err?`<p style="color:var(--neg)">${esc(err)}</p>`:''}${ok?'<p style="color:var(--ok)">Senha trocada.</p>':''}<button data-npw="1">Salvar</button></div>`; }

/* nova ordem vinda do planner */
function drawNova(){ const n=NOVA, t=tot(n.itens), ja=ROWS.find(x=>x.num===n.num&&x.status!=='cancelada');
  $('#app').innerHTML=HEAD()+`<h1>Enviar ${esc(n.numero)}</h1><p class="cap">Gerada no planner. Confira e envie ao fornecedor.</p>
  <div class="card"><div class="meta"><div><small>Fornecedor</small><b>${esc(n.fornecedor)}</b></div><div><small>Contato</small><b>${esc(n.contato||'')}</b></div><div><small>Entrega</small><b>${esc(n.entrega||'')}</b></div><div><small>Pagamento</small><b>${esc(n.pagamento||'')}</b></div></div>
  <table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Preço</th><th class="r">Total</th></tr></thead><tbody>${n.itens.map(i=>`<tr><td>${esc(i.n)}</td><td class="r">${nf(i.q)} ${esc(i.un)}</td><td class="r">${brl(i.p)}</td><td class="r">${brl(i.q*i.p)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total</td><td class="r">${brl(t)}</td></tr></tfoot></table>
  ${ja?`<p class="cap" style="margin-top:12px">Já existe uma ${esc(n.numero)} no banco (${esc(ja.status)}). Criar de novo cancela a anterior.</p>`:''}
  <div class="acts"><button data-criar="1">${ja?'Criar de novo e enviar':'Criar e enviar ao fornecedor'}</button><button class="gh" data-volta="1">Agora não</button></div></div>`; }
async function criar(){ const n=NOVA; const ja=ROWS.find(x=>x.num===n.num&&x.status!=='cancelada'); if(ja) await rpc('oc_cancelar',{p_senha:PASS,p_token:ja.token}).catch(()=>{});
  const tk=await rpc('oc_criar',{p_senha:PASS,p:{num:n.num,numero:n.numero,fornecedor:n.fornecedor,contato:n.contato,entrega:n.entrega,pagamento:n.pagamento,total:+tot(n.itens).toFixed(2),itens:n.itens}});
  CONT[tk]={wa:n.wa||'',em:n.em||''}; LS.set('tsff-oc-cont',CONT); NOVA=null; history.replaceState(null,'',location.pathname); await load(); SEL=tk; drawOC(); }

/* uma ordem */
function waMsg(o){ return `Olá, ${o.contato||''}! Aqui é da The Soul Food Factory.\n\n*Ordem de compra ${o.numero}*\nEntrega: ${o.entrega||''} · Av. Cel. Marcos, 1000 (Zona Sul, POA)\nPagamento: ${o.pagamento||''}\nTotal estimado: ${brl(o.total)}\n\nConfira os itens, quantidades e preços e responda por este link:\n${WEB}?t=${o.token}\n\nObrigado!`; }
function offMsg(o){ const u=WEB+'?v='+encodeURIComponent(o.numero)+'&c='+o.codigo; return `Olá, ${o.contato||''}! Segue a *ordem de compra oficial ${o.numero}*, aprovada pela The Soul Food Factory.\n\nTotal: ${brl(o.aprovacao&&o.aprovacao.total)}\nEntrega: ${o.entrega||''}\nPagamento: ${o.pagamento||''}\n\nVeja, imprima e confira a validade aqui:\n${u}\n\n*Coloque o número ${o.numero} na nota fiscal* (campo Pedido de compra ou informações complementares). Obrigado!`; }
const waL=(o,m)=>`https://wa.me/${String((CONT[o.token]||{}).wa||'').replace(/\D/g,'')}?text=${encodeURIComponent(m)}`;
const emL=(o,s,m)=>`mailto:${encodeURIComponent((CONT[o.token]||{}).em||'')}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(m.replace(/\*/g,''))}`;
let RJ={};
function drawOC(){ const o=ROWS.find(x=>x.token===SEL); if(!o){ SEL=null; return draw(); } const R=o.resposta, ap=o.status==='aprovada'||o.status==='recebida';
  const items=o.itens.map((i,k)=>{ const r=R&&R.itens&&R.itens[k]; const a=ap&&o.aprovacao&&o.aprovacao.itens?o.aprovacao.itens[k]:null; return {i,r,a,k}; });
  let body='';
  if(R&&!ap){ let t0=0,t1=0; body=`<table><thead><tr><th class="c">Aceitar</th><th>Item</th><th class="r">Pedido</th><th class="r">Vai entregar</th><th class="r">Preço pedido</th><th class="r">Preço novo</th><th class="r">Total</th></tr></thead><tbody>${items.map(({i,r,k})=>{ const no=r&&r.no, q=r?+r.q:+i.q, p=r?+r.p:+i.p, rj=RJ[k]; t0+=i.q*i.p; if(!no&&!rj) t1+=q*p; const cq=!no&&Math.abs(q-i.q)>0.0005, cp=!no&&Math.abs(p-i.p)>0.005;
      return `<tr class="${rj?'rj':''}"><td class="c">${no?'—':`<input type="checkbox" data-rj="${k}" ${rj?'':'checked'}>`}</td><td>${esc(i.n)}${r&&r.ob?`<br><span class="cap">${esc(r.ob)}</span>`:''}</td><td class="r">${nf(i.q)} ${esc(i.un)}</td><td class="r ${no?'no':cq?'ch':''}">${no?'não tem':nf(q)+' '+esc(i.un)}</td><td class="r">${brl(i.p)}</td><td class="r ${cp?'ch':''}">${brl(p)}</td><td class="r">${no||rj?'—':brl(q*p)}</td></tr>`; }).join('')}</tbody><tfoot><tr><td colspan="6">Total ${brl(t0)} → aprovado</td><td class="r">${brl(t1)}</td></tr></tfoot></table>
    <p class="cap">Desmarque um item para tirá-lo da ordem (por exemplo, se o preço subiu). Ele vai para a lista do que faltou.</p>${R.obs?`<p>Obs. do fornecedor: ${esc(R.obs)}</p>`:''}
    <div class="acts"><button data-aprovar="1">Aprovar e emitir a OC oficial</button><button class="gh" data-cancelar="1">Cancelar ordem</button></div>`; }
  else if(ap||o.status==='recebida'){ const A=o.aprovacao||{}, it=A.itens||[]; body=`<table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Preço</th><th class="r">Total</th></tr></thead><tbody>${it.filter(x=>!x.no).map(x=>`<tr><td>${esc(x.n)}</td><td class="r">${nf(x.q)} ${esc(x.un)}</td><td class="r">${brl(x.p)}</td><td class="r">${brl(x.q*x.p)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total aprovado</td><td class="r">${brl(A.total)}</td></tr></tfoot></table>
    <div class="acts" style="margin-top:12px">${o.status==='aprovada'?`<span>Entrega prevista: <b>${esc(dl(odata(o).d,odata(o).t))}</b></span><button data-receber="1">Marcar como recebida</button>`:`<span class="pill aprovada">recebida</span><span class="cap">${esc(((A.recebimento||{}).por)||'')} · ${dt((A.recebimento||{}).em)}</span>`}</div><div class="off"><div class="qr" id="qr"></div><div style="flex:1;min-width:240px"><h3>✓ OC oficial emitida · código ${esc(o.codigo)}</h3><p class="cap">O QR abre a página de validação. Só ordens com código válido podem ser faturadas.</p><div class="acts" style="margin-top:8px"><a class="b wa" href="${waL(o,offMsg(o))}" target="_blank" rel="noopener">Enviar OC oficial no WhatsApp</a><a class="b gh" href="${emL(o,o.numero+' · ordem de compra oficial',offMsg(o))}" target="_blank" rel="noopener">E-mail</a><a class="b gh" href="${WEB}?v=${encodeURIComponent(o.numero)}&c=${o.codigo}" target="_blank" rel="noopener">Ver / imprimir PDF</a></div></div></div>
    ${it.some(x=>x.no)?`<div class="falta"><h4>Falta pedir em outro lugar</h4><ul>${it.filter(x=>x.no).map(x=>`<li>${esc(x.n)}: ${nf(o.itens.find(y=>y.n===x.n)?o.itens.find(y=>y.n===x.n).q:x.q)} ${esc(x.un)}</li>`).join('')}</ul><p class="cap" style="margin:6px 0 0">Gere a ordem desses itens com outro fornecedor, ou compre no supermercado ou atacado.</p></div>`:''}`; }
  else { body=`<table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Preço</th><th class="r">Total</th></tr></thead><tbody>${o.itens.map(i=>`<tr><td>${esc(i.n)}</td><td class="r">${nf(i.q)} ${esc(i.un)}</td><td class="r">${brl(i.p)}</td><td class="r">${brl(i.q*i.p)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total</td><td class="r">${brl(o.total)}</td></tr></tfoot></table>
    ${o.status==='enviada'?`<div class="acts"><a class="b wa" href="${waL(o,waMsg(o))}" target="_blank" rel="noopener">Enviar no WhatsApp</a><a class="b gh" href="${emL(o,o.numero+' · The Soul Food Factory',waMsg(o))}" target="_blank" rel="noopener">E-mail</a><button class="gh" data-copiar="1">Copiar link do fornecedor</button><button class="gh" data-cancelar="1">Cancelar ordem</button></div><p class="cap">Aguardando o fornecedor abrir o link e responder.</p>`:''}`; }
  $('#app').innerHTML=HEAD()+`<p style="margin-top:14px"><button class="gh" data-volta="1">← Todas as ordens</button></p><h1>${esc(o.numero)} <span class="pill ${o.status==='respondida'?o.classe:o.status}">${o.status==='respondida'?CL[o.classe]:o.status}</span></h1>
  <div class="card"><div class="meta"><div><small>Fornecedor</small><b>${esc(o.fornecedor)}</b></div><div><small>Contato</small><b>${esc((R&&R.nome)||o.contato||'')}</b></div><div><small>Entrega</small><b>${esc((R&&R.entrega)||o.entrega||'')}</b></div><div><small>Pagamento</small><b>${esc(o.pagamento||'')}</b></div></div>${body}
  <div class="tl"><span>Criada ${dt(o.created_at)}</span>${o.respondido_em?`<span>Respondida ${dt(o.respondido_em)} · ${CL[o.classe]||''}</span>`:''}${o.aprovada_em?`<span>Aprovada ${dt(o.aprovada_em)} · código ${esc(o.codigo)}</span>`:''}</div></div>`;
  if(ap||o.status==='recebida') qr(WEB+'?v='+encodeURIComponent(o.numero)+'&c='+o.codigo); }
async function aprovar(){ const o=ROWS.find(x=>x.token===SEL); const R=o.resposta||{}; const it=o.itens.map((i,k)=>{ const r=(R.itens||[])[k]; const no=(r&&r.no)||RJ[k]; return {n:i.n,un:i.un,q:r?+r.q:+i.q,p:r?+r.p:+i.p,no:!!no}; });
  const total=+it.reduce((a,x)=>a+(x.no?0:x.q*x.p),0).toFixed(2); const b=$('[data-aprovar]'); b.disabled=true; b.textContent='Emitindo…';
  try{ await rpc('oc_aprovar',{p_senha:PASS,p_token:o.token,p:{total,itens:it,pagamento:o.pagamento,entrega:R.entrega||o.entrega,data:R.data||'',turno:R.turno||'',aprovador:'Jorge',obs:R.obs||''}}); RJ={}; await load(); drawOC(); toast('OC oficial emitida.'); }catch(e){ b.disabled=false; b.textContent='Aprovar e emitir a OC oficial'; alert(e.message); } }
function qr(u){ const go=()=>{ try{ const q=qrcode(0,'M'); q.addData(u); q.make(); const el=$('#qr'); if(el) el.innerHTML=q.createSvgTag({cellSize:3,margin:0,scalable:true}); }catch(_){ } }; if(window.qrcode) return go(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; s.onload=go; document.head.appendChild(s); }

document.addEventListener('click',async e=>{ const g=e.target.closest('[data-sync],[data-entrarleg],[data-receber],[data-planner],[data-primeiro],[data-dd],[data-ni],[data-nall],[data-view],[data-unovo],[data-uat],[data-npw],[data-entrar],[data-sair],[data-tab],[data-oc],[data-volta],[data-criar],[data-aprovar],[data-cancelar],[data-copiar],[data-notif]'); if(!g) return; const d=g.dataset;
  if(!d.dd&&DD&&!g.closest('.dd')){ DD=null; }
  if(d.planner){ if(window.opener&&!window.opener.closed){ window.close(); setTimeout(()=>{ location.href='https://claude.ai/artifact/WnSbCeXQaF6FDig2DLzin8'; },300); } else location.href='https://claude.ai/artifact/WnSbCeXQaF6FDig2DLzin8'; return; }
  if(d.sync){ const S2=ROWS.map(o=>{ const z=odata(o), A=o.aprovacao||{}; return {n:o.num,s:o.status,d:z.d,t:z.t,it:(A.itens||((o.resposta||{}).itens)||[]).map(x=>[+(+x.q).toFixed(3),+(+x.p).toFixed(2),x.no?1:0]),c:o.codigo||'',nm:(o.resposta||{}).nome||o.contato||''}; });
    const code='TSFF1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S2)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    try{ await navigator.clipboard.writeText(code); toast('Copiado. No planner, toque em “Atualizar com o painel”.'); }catch(_){ prompt('Copie e cole no planner:',code); } return; }
  if(d.entrarleg) return entrarLeg(); if(d.primeiro) return entrar(true); if(d.entrar) return entrar(false);
  if(d.sair){ DD=null; try{ await rpc('u_sair',{p_tok:PASS}); }catch(_){ } PASS=''; ME=null; NOTIFS=[]; LS.set('tsff-tok',''); return login(); }
  if(d.dd){ DD=DD===d.dd?null:d.dd; return draw(); }
  if(d.ni){ const n=NOTIFS.find(x=>x.id==d.ni); DD=null; if(n){ await ler([n.id]); if(n.ref&&ROWS.find(x=>x.token===n.ref)){ VIEW='oc'; SEL=n.ref; RJ={}; return drawOC(); } } return draw(); }
  if(d.nall){ await ler(NOTIFS.filter(n=>!n.lida).map(n=>n.id)); return draw(); }
  if(d.view){ DD=null; VIEW=d.view; SEL=null; return draw(); }
  if(d.unovo){ try{ await rpc('u_criar',{p_tok:PASS,p_nome:$('#unm').value,p_email:$('#uem').value,p_senha:$('#upw').value}); toast('Usuário cadastrado.'); drawUs(); }catch(err){ drawUs(err.message); } return; }
  if(d.uat){ try{ await rpc('u_ativo',{p_tok:PASS,p_id:d.uat,p_ativo:d.v==='true'}); }catch(err){ alert(err.message); } return drawUs(); }
  if(d.npw){ try{ await rpc('u_senha',{p_tok:PASS,p_nova:$('#np').value}); drawPw(null,true); }catch(err){ drawPw(err.message); } return; }
  if(d.tab){ TAB_SET=true; TAB=d.tab; return draw(); } if(d.oc){ SEL=d.oc; RJ={}; return drawOC(); } if(d.volta){ SEL=null; NOVA=null; history.replaceState(null,'',location.pathname); return draw(); }
  if(d.criar){ g.disabled=true; g.textContent='Criando…'; try{ await criar(); }catch(err){ g.disabled=false; alert(err.message); } return; }
  if(d.aprovar) return aprovar();
  if(d.receber){ g.disabled=true; try{ await rpc('oc_receber',{p_senha:PASS,p_token:SEL,p:{em:new Date().toISOString(),por:(ME&&ME.nome)||''}}); await load(); toast('Recebimento registrado.'); return drawOC(); }catch(err){ g.disabled=false; alert(err.message); } return; }
  if(d.cancelar){ if(!confirm('Cancelar esta ordem?')) return; await rpc('oc_cancelar',{p_senha:PASS,p_token:SEL}); await load(); return drawOC(); }
  if(d.copiar){ try{ await navigator.clipboard.writeText(WEB+'?t='+SEL); toast('Link copiado.'); }catch(_){ prompt('Link do fornecedor:',WEB+'?t='+SEL); } return; }
  if(d.notif){ try{ await Notification.requestPermission(); }catch(_){ } draw(); } });
document.addEventListener('change',e=>{ const k=e.target.dataset&&e.target.dataset.rj; if(k==null) return; RJ[k]=!e.target.checked; drawOC(); });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='pw'){ if($('[data-entrarleg]')) entrarLeg(); else entrar(!!$('#nm')); } });
document.addEventListener('click',e=>{ if(DD&&!e.target.closest('.dd')&&!e.target.closest('[data-dd]')){ DD=null; draw(); } });
async function start(){ NOVA=decNova(); if(/usuarios/.test(location.hash)) VIEW='us'; try{ await me(); }catch(e){ PASS=''; LS.set('tsff-tok',''); return login(/permiss/.test(e.message)?'Entre para continuar.':e.message); } $('#app').innerHTML=HEAD()+'<p class="cap" style="margin-top:20px">Carregando…</p>'; await load(); }
setInterval(()=>{ if(PASS&&!document.hidden) load(true); },30000);
document.addEventListener('visibilitychange',()=>{ if(PASS&&!document.hidden) load(true); });
if(PASS) start(); else { NOVA=decNova(); login(); }
</script>
</body>
</html>
